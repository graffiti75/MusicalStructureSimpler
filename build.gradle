// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Define the Android Gradle Plugin version.
        // For AGP 8.x and higher, it's recommended to define this in settings.gradle.kts or settings.gradle.
        // However, for this migration, we'll keep it here for now.
        // For newer projects, the plugins block at the top level is preferred.
    }
}

plugins {
    id("com.android.application") version "8.2.0" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
